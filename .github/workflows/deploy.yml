name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # permite correrlo a mano desde la pestana Actions

jobs:
  deploy:
    name: pull - build - restart
    runs-on: ubuntu-latest

    steps:
      - name: install ssh key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H 165.22.53.200 > ~/.ssh/known_hosts

      # La app dejo de ser un sitio estatico: ya no se buildea aca ni se hace
      # rsync de dist/. Ahora es un proceso Node (adapter-node) bajo pm2 en el
      # droplet, asi que el build ocurre ALLA y esto solo lo dispara.
      #
      # El .env del droplet NO se genera aca a proposito. Vive en
      # /root/code/svelte_geo_kit/.env y ahi estan ORIGIN/PORT/HOST mas las
      # VITE_FIREBASE_*, que se necesitan EN TIEMPO DE BUILD: sin ellas el
      # bundle sale con la config de Firebase en undefined y la app se queda
      # colgada para siempre en "Cargando..." sin un solo error en consola.
      #
      # Node/npm/pm2 viven en nvm y una shell SSH no-interactiva no los tiene en
      # el PATH, por eso se carga nvm explicitamente. La cadena con && aborta si
      # algo falla, asi pm2 NO reinicia con un build roto.
      - name: deploy on droplet
        run: |
          ssh root@165.22.53.200 'export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh" && nvm use node >/dev/null && cd ~/code/svelte_geo_kit && git checkout main && git pull origin main && npm ci && npm run build && pm2 restart svelte-geo-kit --update-env'

      - name: verify
        run: |
          ssh root@165.22.53.200 'curl -sf -o /dev/null -w "app en :3900 -> HTTP %{http_code}
" http://127.0.0.1:3900/'
          curl -sf -o /dev/null -w "geoservices.space -> HTTP %{http_code}
" https://geoservices.space/
          curl -sf -o /dev/null -w "product-details.json -> HTTP %{http_code}
" https://geoservices.space/product-details.json
          curl -sf -o /dev/null -w "track/health -> HTTP %{http_code}
" https://geoservices.space/track/health

      - name: cleanup
        run: rm -rf ~/.ssh
