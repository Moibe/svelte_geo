name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 165.22.53.200 >> ~/.ssh/known_hosts

      - name: Create .env file from GitHub Secrets
        run: |
          cat > .env << EOF
          VITE_STRIPE_PROD_API_KEY=${{ secrets.VITE_STRIPE_PROD_API_KEY }}
          VITE_STRIPE_PROD_PRODUCT_ID=${{ secrets.VITE_STRIPE_PROD_PRODUCT_ID }}
          VITE_STRIPE_TEST_API_KEY=${{ secrets.VITE_STRIPE_TEST_API_KEY }}
          VITE_STRIPE_TEST_PRODUCT_ID=${{ secrets.VITE_STRIPE_TEST_PRODUCT_ID }}
          VITE_STRIPE_TEST_PRICE_ID=${{ secrets.VITE_STRIPE_TEST_PRICE_ID }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          EOF
          echo "✅ .env creado desde GitHub Secrets"
          grep "VITE_STRIPE_TEST_PRICE_ID" .env

      - name: Build project
        run: npm run build

      - name: Verify compiled JS contains correct price_id
        run: |
          echo "Checking if compiled JS has correct price_id:"
          if grep -q "price_1SDXvuROVpWRmEfBsAGp37kf" dist/assets/*.js; then
            echo "✅ Correct price_id found in compiled JS"
          else
            echo "❌ WARNING: price_1SDXvuROVpWRmEfBsAGp37kf NOT found!"
            echo "Checking for fallback:"
            grep -o "price_test_default" dist/assets/*.js | head -5 || echo "Fallback not found either"
          fi

      - name: Pull latest code on server
        run: |
          ssh root@165.22.53.200 "cd /root/code/svelte_geo && git reset --hard && git pull origin main"

      - name: Deploy to server
        run: |
          rsync -av --delete dist/ root@165.22.53.200:/root/code/svelte_geo/dist/

      - name: Verify deployment
        run: |
          ssh root@165.22.53.200 "ls -la /root/code/svelte_geo/dist/ | head -10"

      - name: Deployment summary
        if: success()
        run: echo "🚀 Deploy a 165.22.53.200 completado exitosamente"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ El deploy falló. Revisa los logs arriba."
