<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0052cc" />
    <!-- La declaración de codificación (<meta charset>) tiene que ir PRIMERO: la respuesta no
         manda `charset` en su Content-Type y el navegador solo la busca en los primeros 1024
         bytes. El script de consentimiento, que es largo, va después a propósito. -->

    <!-- Consentimiento de cookies + Google Tag Manager. Lo genera hooks.server.js
         (ver $lib/consentimiento-arranque.js). Va ANTES de cualquier otro script: decide
         si Google se carga siquiera (en la UE, el Reino Unido y Suiza, solo con permiso) y le
         manda a Google el estado de Consent Mode antes de que despierte. -->
    %consent.script%
    <!-- Sin JavaScript no hay forma de contestar el aviso (y tampoco se carga Google ni se registra nada):
         pintado desde el servidor, quedaría una caja con botones que no hacen nada. -->
    <noscript><style>.aviso { display: none !important; }</style></noscript>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Sin <title> aquí a propósito: cada página pone el suyo (traducido) con
         $lib/Seo.svelte. Uno fijo en este archivo se sumaría al de la página. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- GTM (noscript): solo para quien está seguro fuera de la región regulada. -->
    %consent.noscript%

    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
